services:
  lanka:
    build:
      context: .
      args:
        MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:-}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: lanka
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - NODE_ENV=production
      # Pin bind host/port here so they always win over env_file (.env). A stray
      # dev PORT (e.g. 5100) would otherwise make the app listen off the port
      # nginx proxies (127.0.0.1:3000) and break the healthcheck — total outage.
      - HOST=127.0.0.1
      - PORT=3000
      - DATABASE_URL=file:/app/data/signage.db
      - MEDIA_DIR=/app/data/media
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
