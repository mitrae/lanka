# Rate-limit zone for login brute-force (5 requests/min per source IP).
limit_req_zone $binary_remote_addr zone=lanka_login:10m rate=5r/m;
# Rate-limit zone for password-reset requests (email cost/abuse; resets are rare).
limit_req_zone $binary_remote_addr zone=lanka_reset:10m rate=3r/m;

upstream lanka_app { server 127.0.0.1:3000; }

# ---------- PUBLIC block: cloudflared dials this. Plain http on loopback. ----------
server {
    listen 127.0.0.1:8080;
    server_name app.lanka.live;

    # Cloudflare's FREE plan caps proxied request bodies at 100 MB. Uploads
    # larger than that must go via the tailnet block instead (see README).
    client_max_body_size 100m;

    # Collapse duplicate slashes so `//api/devices/...` can't dodge the
    # per-action denies below. This is nginx's default, but pin it explicitly so
    # a global `merge_slashes off;` elsewhere can't silently open a bypass.
    merge_slashes on;

    # Device control plane: the no-session, device-ONLY endpoints are never
    # served publicly (cloudflared only reaches this block) — they're tailnet-
    # only. Deny them per-action; the trailing `/?$` closes the trailing-slash
    # bypass and merge_slashes handles `//`.
    #
    # IMPORTANT: do NOT blanket-deny the /api/devices or /api/apk namespaces —
    # the admin dashboard reaches THIS block (app.lanka.live -> cloudflared) and
    # legitimately calls session-gated /api/devices/:id/{status,reload,commands},
    # PATCH/DELETE /api/devices/:id, and /api/apk list/upload/delete. Those must
    # keep proxying; only the device-facing actions below are denied.
    location ~ ^/api/devices/register/?$ { return 403; }
    location ~ ^/api/devices/[^/]+/(manifest|stream|telemetry|ws)/?$ { return 403; }
    location ~ ^/api/apk/[^/]+/download/?$ { return 403; }

    # Throttle login.
    location = /api/auth/login {
        limit_req zone=lanka_login burst=5 nodelay;
        proxy_pass http://lanka_app;
        include /etc/nginx/snippets/lanka-proxy.conf;
    }

    # Throttle password-reset requests (each one can send an email).
    location = /api/auth/forgot-password {
        limit_req zone=lanka_reset burst=3 nodelay;
        proxy_pass http://lanka_app;
        include /etc/nginx/snippets/lanka-proxy.conf;
    }

    # Dashboard SSE: stream, don't buffer.
    location = /api/dashboard/stream {
        proxy_pass http://lanka_app;
        include /etc/nginx/snippets/lanka-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://lanka_app;
        include /etc/nginx/snippets/lanka-proxy.conf;
    }
}

# ---------- TAILNET block: the TVs hit this. Plain http over WireGuard. ----------
server {
    listen TAILSCALE_IP:80;
    server_name _;

    client_max_body_size 600m;  # full media uploads allowed over the tailnet

    # Device WebSocket command channel: upgrade required.
    location ~ ^/api/devices/[^/]+/ws$ {
        proxy_pass http://lanka_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Device SSE stream: stream, don't buffer.
    location ~ ^/api/devices/[^/]+/stream$ {
        proxy_pass http://lanka_app;
        include /etc/nginx/snippets/lanka-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://lanka_app;
        include /etc/nginx/snippets/lanka-proxy.conf;
    }
}
